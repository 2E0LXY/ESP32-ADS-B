name: Server tests

# The server has a real test suite that nothing ran automatically until
# now: the other two workflows here build and publish firmware releases and
# only fire on a v* tag, so a pull request got no checks at all and an empty
# check list looked exactly like a passing one.
on:
  pull_request:
    paths: ["server/**", ".github/workflows/server-tests.yml"]
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server-tests.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the container the service actually runs in - see
          # server/Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
