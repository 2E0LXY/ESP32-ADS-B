name: Build firmware release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/verify_release_version.py
      - name: Build firmware
        run: pio run
      - name: Prepare release files
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          test -n "$FIRMWARE_SIGNING_KEY"
          cp .pio/build/waveshare_esp32_s3_lcd_4/firmware.bin ESP32-ADSB-firmware.bin
          cp .pio/build/waveshare_esp32_s3_lcd_4/firmware.factory.bin ESP32-ADSB-factory.bin
          printf '%s' "$FIRMWARE_SIGNING_KEY" > firmware-private.pem
          openssl dgst -sha256 -sign firmware-private.pem -out ESP32-ADSB-firmware.bin.sig ESP32-ADSB-firmware.bin
          rm -f firmware-private.pem
          sha256sum ESP32-ADSB-firmware.bin ESP32-ADSB-factory.bin > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ESP32-ADSB-firmware.bin
            ESP32-ADSB-firmware.bin.sig
            ESP32-ADSB-factory.bin
            SHA256SUMS.txt
