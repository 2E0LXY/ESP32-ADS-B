[env]
build_src_filter = +<*> -<bringup_ws7.cpp> -<WS_CH422G.cpp>

[env:waveshare_esp32_s3_lcd_4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11-libs.tar.xz
extra_scripts = pre:scripts/generate_secrets.py
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
  ; Rev 4.0 480x480 panel has no touch controller. Set to 1 to re-enable GT911
  ; probing at boot and per-loop I2C polling.
  -DADSB_BOARD_WS4
  -DADSB_ENABLE_TOUCH=0
  ; Set to 1 only if the ESP-IDF certificate bundle is unavailable in your
  ; toolchain; doing so disables TLS certificate validation.
  -DADSB_TLS_INSECURE=0
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  tzapu/WiFiManager@^2.0.17
  bitbank2/PNGdec@1.1.6
  links2004/WebSockets@^2.6.1

; Serial port is machine specific. Override locally with:
;   pio run -t upload --upload-port COM25
; or create platformio_local.ini / set PLATFORMIO_UPLOAD_PORT.

; Panel bring-up for the 800x480 boards (ESP32-S3-Touch-LCD-7 and -4.3).
; Compiles src/bringup_ws7.cpp alone; the ADS-B application is excluded.
[env:ws_lcd_7_bringup]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11-libs.tar.xz
extra_scripts =
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_src_filter = -<*> +<bringup_ws7.cpp> +<WS_CH422G.cpp>
build_flags =
  -DBOARD_HAS_PSRAM
  -DADSB_BOARD_WS7
  ; Serial maps to UART0 (GPIO43/44) so logs leave via the CH343P port
  ; marked UART on the silkscreen, which the app cannot drop off the bus.
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=3
lib_deps =

; default_16MB.csv sits in the project root rather than being taken from the
; framework's tools/partitions. Once custom_sdkconfig (below) puts this
; environment through the ESP-IDF build path, board_build.partitions is only
; resolved relative to the project, so the framework's copy is never found and
; the build stops with "Missing partition table file". The root copy is byte
; for byte the file from arduino-esp32 3.3.11 - the layout has to stay
; identical or a USB flash would move the NVS partition and wipe every saved
; setting. Verify with:
;   fc default_16MB.csv "%USERPROFILE%\.platformio\packages\framework-arduinoespressif32\tools\partitions\default_16MB.csv"
;
; Full ADS-B application for the 800x480 boards. Layout literals are still
; 480-centric, so the render pages sit in the upper-left region until the
; layout refactor lands. Everything else - panel, expander, SD, web UI - is
; board-resolved.
[env:ws_lcd_7_app]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11-libs.tar.xz
extra_scripts = pre:scripts/generate_secrets.py
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_src_filter = +<*> -<bringup_ws7.cpp> -<WS_CH32_IO.cpp>
build_flags =
  -DBOARD_HAS_PSRAM
  -DADSB_BOARD_WS7
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=1
  -DADSB_ENABLE_TOUCH=1
  -DADSB_TLS_INSECURE=0
  ; esp_lcd allocates two bounce buffers of (lines * width * 2) bytes from
  ; internal DMA RAM. Arduino_GFX's default of 40 lines costs 125 KB at
  ; 800 px wide and leaves too little internal heap for mbedTLS, so every
  ; HTTPS request fails with -32512. 20 lines costs 64 KB, which clears
  ; mbedTLS without starving the RGB DMA: at 10 lines the full-screen PSRAM
  ; copies in present() underran the refill and rolled the frame vertically.
  ; This was left at 30 (96 KB - between the two tested-good values, and
  ; never itself verified against either symptom) despite the above; a whole
  ; session's worth of "-32512 SSL - Memory allocation failed" failures and
  ; a recurring frame roll traces back to exactly that gap. Set to the
  ; value this comment already established as correct.
  -DRGB_BOUNCE_BUFFER_LINES=20
; The frame roll ("the top of the screen appears at the bottom") is the RGB
; panel losing DMA sync: the bounce-buffer refill misses its deadline while
; the CPU is saturating the same PSRAM bus, and the panel then scans out
; permanently offset. main.cpp tries to recover from that in six places by
; calling rgbpanel->restartAtNextVsync(), and with the stock prebuilt Arduino
; IDF every one of those calls is a no-op: esp_lcd_rgb_panel_restart()
; returns ESP_ERR_INVALID_STATE without CONFIG_LCD_RGB_RESTART_IN_VSYNC.
; present() logs "RGB vsync restart supported: yes/no" at boot and has always
; printed NO.
;
; Do NOT turn those options on here. It was tried, via custom_sdkconfig:
;
;   CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
;   CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
;   CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
;   CONFIG_GDMA_ISR_IRAM_SAFE=y
;
; The banner did flip to "yes", so the diagnosis of why the recovery never
; fires is correct. The board then boot-looped on the very next line:
;
;   Guru Meditation Error: Core 1 panic'ed (Cache error).
;   Cache disabled but cached memory region accessed
;
; That is inherent to this panel configuration, not a tuning problem.
; RESTART_IN_VSYNC requires LCD_RGB_ISR_IRAM_SAFE, and an IRAM-safe RGB ISR
; must never touch cached memory - but this board runs fb_in_psram with
; bounce buffers, so the refill that ISR performs reads the framebuffer out
; of PSRAM on every scanline. Without the IRAM-safe flags the ISR is simply
; suspended while the cache is off; with them it keeps running and
; dereferences PSRAM with the cache disabled, which is precisely the panic
; above. The two features are mutually exclusive here.
;
; Fixing the roll therefore means removing the PSRAM read from the refill
; path - drawing into the panel's own framebuffer instead of present()
; copying 768 KB PSRAM-to-PSRAM every frame - not enabling the restart.
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  tzapu/WiFiManager@^2.0.17
  bitbank2/PNGdec@1.1.6
  links2004/WebSockets@^2.6.1
