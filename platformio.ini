[env:waveshare_esp32_s3_lcd_4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11-libs.tar.xz
build_src_filter = +<*> -<Display_ST7701.cpp> -<I2C_Driver.cpp> -<TCA9554PWR.cpp>
extra_scripts = pre:scripts/generate_secrets.py
monitor_speed = 115200
upload_port = COM25
monitor_port = COM25
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  tzapu/WiFiManager@^2.0.17
  bitbank2/PNGdec@1.1.6
