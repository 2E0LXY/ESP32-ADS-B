services:
  adsb-aggregator:
    build: .
    container_name: adsb-aggregator
    restart: unless-stopped
    # Host networking instead of published ports: the feeder range is up to
    # 900 ports (FEEDER_PORT_RANGE_START/END in .env), and Docker's default
    # bridge networking creates one NAT/iptables rule per published port -
    # on a small VPS that's enough forked iptables processes to exhaust the
    # process table and hang the whole machine (seen in practice). Host mode
    # skips Docker's per-port NAT entirely; the app binds 0.0.0.0 directly on
    # the VPS's own network stack (see Dockerfile CMD and feed_ingest.py).
    # Caddy still reverse-proxies 127.0.0.1:8090 to adsb.2e0lxy.uk with no
    # Caddyfile change needed, since that's now a normal host-local port.
    # The VPS firewall must still allow inbound TCP on the feeder range
    # (see README.md) - host mode doesn't change that requirement.
    network_mode: host
    # Host mode means the container shares the VPS's own network stack, so
    # the app's bind address is no longer sandboxed by Docker port publishing
    # - pin the HTTP/admin surface to localhost explicitly (Caddy still
    # proxies it from there) so it isn't reachable directly over plain HTTP.
    # Feeder listeners are opened separately by the app itself on 0.0.0.0
    # (see feed_ingest.py) since those are meant to be internet-reachable.
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8090"]
    volumes:
      - adsb-data:/data
    env_file:
      - .env

  # Only needed to run more than one uvicorn worker: it holds the shared
  # aircraft cache (app/cache.py) and the single-instance lease
  # (app/leader.py). With REDIS_URL unset the app ignores it entirely and
  # behaves exactly as it did before, so this service is harmless to leave
  # running and harmless to remove.
  #
  # Host networking to match the app container, and bound to localhost only:
  # this holds live aircraft positions and must not be reachable from the
  # internet. Redis has no authentication enabled here - the bind address is
  # what protects it, so do not change that without adding a password.
  redis:
    image: redis:7-alpine
    container_name: adsb-redis
    restart: unless-stopped
    network_mode: host
    command: >
      redis-server
      --bind 127.0.0.1
      --port 6379
      --save ""
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy noeviction
    # noeviction, not an LRU policy: the single-instance lease lives in here
    # alongside the aircraft, and no eviction policy can be told to spare
    # it. Evicting the lease would let a second worker take the role while
    # the current holder still believes it has it - two leaders, which is
    # the one thing app/leader.py exists to prevent. 128 MB is orders of
    # magnitude more than a few thousand aircraft need, so if this limit is
    # ever reached something is wrong and a failed write that shows up in
    # the logs is the useful outcome.
    #
    # No persistence at all: every key in here is either a live aircraft
    # (gone in five minutes anyway) or a lease that is meant to expire.
    # Restarting Redis costs one poll cycle, not data - so writing it to
    # disk would be pure I/O for nothing.

volumes:
  adsb-data:
