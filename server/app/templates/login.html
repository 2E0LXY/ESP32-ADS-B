{% extends "base.html" %}
{% block header_title %}2E0LXY ADS-B - Log in{% endblock %}
{% block content %}
<div class="panel" style="max-width:400px;margin:40px auto">
<h2>Log in</h2>
<form method="post" action="/login">
<label>Email</label>
<input class="input" style="width:100%" type="email" name="email" required>
<label>Password</label>
<input class="input" style="width:100%" type="password" name="password" required>
<button style="width:100%;margin-top:16px" type="submit">Log in</button>
</form>
<p class="sub" style="margin-top:14px">No account yet? <a href="/signup" style="color:var(--cyan)">Sign up</a></p>
</div>
{% endblock %}
