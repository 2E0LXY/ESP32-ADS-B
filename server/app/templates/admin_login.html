{% extends "base.html" %}
{% block header_title %}Admin login{% endblock %}
{% block content %}
<div class="panel" style="max-width:400px;margin:40px auto">
<h2>Admin login</h2>
<form method="post" action="/admin/login">
<label>Email</label>
<input class="input" style="width:100%" type="email" name="email" required>
<label>Password</label>
<input class="input" style="width:100%" type="password" name="password" required>
<button style="width:100%;margin-top:16px" type="submit">Log in</button>
</form>
</div>
{% endblock %}
